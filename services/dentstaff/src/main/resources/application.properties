quarkus.application.name=dentstaff-service
quarkus.http.host=0.0.0.0
quarkus.http.port=8081
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:dentsuite}
quarkus.datasource.password=${DB_PASSWORD:dentsuite_dev}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dentsuite_staff}
quarkus.flyway.migrate-at-start=true
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${WEB_ORIGIN:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
dentsuite.keycloak.internal-url=${KEYCLOAK_INTERNAL_URL:http://localhost:8180}
dentsuite.keycloak.realm=${KEYCLOAK_REALM:dentsuite}
dentsuite.keycloak.admin-username=${KEYCLOAK_ADMIN_USERNAME:}
dentsuite.keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD:}
dentsuite.registration.employer-code=${EMPLOYER_JOIN_CODE:}
dentsuite.public-web-url=${DENTSUITE_PUBLIC_WEB_URL:http://localhost:3000}
quarkus.mailer.from=${EMAIL_FROM:noreply@dentsuite.local}
quarkus.mailer.host=${SMTP_HOST:mailpit}
quarkus.mailer.port=${SMTP_PORT:1025}
quarkus.mailer.username=${SMTP_USERNAME:}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.start-tls=${SMTP_START_TLS:DISABLED}
quarkus.mailer.ssl=${SMTP_SSL:false}
quarkus.mailer.mock=false
quarkus.oidc.auth-server-url=${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:dentsuite}
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=${KEYCLOAK_ISSUER_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:dentsuite}
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.http.auth.permission.public.paths=/api/v1/info,/api/v1/accounts/register,/q/health,/q/health/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.protected.paths=/api/v1/*
quarkus.http.auth.permission.protected.policy=authenticated
